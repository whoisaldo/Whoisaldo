name: refresh-cards

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fresh cards
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/refresh-cards.sh

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards stars.svg README.md
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore: refresh stat cards and stargazer chart"
            git push
          fi
